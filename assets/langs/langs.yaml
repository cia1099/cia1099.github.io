  yolo-ffi:
    name: 獨立開發
    start: 18/10/2025
    end: 14/12/2025
    address: 台北 台灣
    title: 資深Flutter性能工程師
    content: |
      設計並實現一套 高性能、低延遲的邊緣端實時目標檢測系統，在 Android 與 iOS 設備上以 Flutter 作為統一 UI 框架，通過原生 C++ 推理引擎與零拷貝內存設計，在不犧牲 UI 流暢度的前提下，實現 60 FPS 實時目標檢測，完全脫離雲端推理依賴。
      核心技術實現：
        1. 跨平台高性能推理架構設計
          • 將 YOLO 系列模型部署至移動端邊緣設備，統一在 C++ 推理層完成圖像前處理、模型推理與後處理，避免多語言重覆實現與性能損耗
          • 針對 Android / iOS 平台差異，抽象統一的推理接口層，提升系統可維護性與可擴展性
        2. Flutter ↔ 原生通信性能重構（FFI 替代 MethodChannel）
          • 在 iOS 端采用 Objective-C++ + CoreML 混合編譯，直接暴露 C ABI 給 Dart FFI
          • 完全繞過 MethodChannel 的消息編解碼與對象重建流程，避免 Dart VM 與原生層之間因序列化、內存覆制及類型轉換帶來的額外開銷
          • 將推理全流程（preprocess → inference → postprocess）收斂至 C++ 層，僅回傳最終結構化結果至 Dart
        3. 極致內存管理與零拷貝優化
          • 重構圖像與張量數據結構，覆用同一塊連續內存區域完成圖像采集、前處理與推理
          • 避免不必要的 malloc / free 與中間 buffer 分配，顯著降低 GC 與內存抖動
        4. CPU / GPU / Neural Engine 調度優化
          • 在 iOS 端基於 CoreML 的 Compute Units 策略，動態選擇 CPU / GPU / Neural Engine，結合OpenCV庫，對 ARM 架構優化運算處理圖像數據
          • 針對不同模型規模與設備性能，評估能耗與延遲表現，平衡實時性與功耗
          • Android 端結合 NCNN / MNN 框架和OpenCV庫，針對 ARM 架構優化算子執行路徑
        5. 多線程與並發模型設計（Flutter Isolate）
          • 嚴格分離 UI 與模型推理邏輯
          • 使用 Dart Isolate 獨立運行推理任務，確保主線程專註於 UI 渲染與用戶交互
          • 通過 無鎖（lock-free）隊列 緩存相機幀數據，避免推理阻塞相機串流與畫面顯示
        6. 原生庫跨平台構建體系
          • 使用 NDK + CMake 構建 Android 平台 ONNX、OpenCV、NCNN、MNN 等原生庫
          • 通過 Objective-C++ 在同一編譯單元內直接調用 Apple 原生 SDK 與 C++ 推理與圖像處理庫，規避 JNI / FFI / PlatformChannel 等跨層通信模型，減少 ABI 邊界、對象封裝及內存拷貝帶來的性能損耗
          • 統一管理編譯參數與 ABI，確保在多設備架構下的穩定性與性能一致性
      項目成果：
        1. 在 Android 與 iOS 邊緣設備 上實現 60 FPS 實時目標檢測，UI 刷新零掉幀
        2. 每一幀影像可實時記錄目標位置與分類結果，無需依賴任何遠程服務器推理
        3. Flutter 應用在高負載 AI 推理場景下依然保持流暢交互體驗
        4. 顯著降低跨語言通信開銷與內存占用，系統整體延遲大幅下降
        5. 架構具備高度可擴展性，可快速替換不同模型與推理後端
