    flutter: Flutter 是谷歌的用戶界面工具包，用於從單一代碼庫中為移動、網絡和桌面構建美觀的本地編譯應用程序。我的簡介 - 此應用程序使用 Flutter 製作:)
    swift: Swift 是蘋果公司為 iOS、iPadOS、macOS、watchOS、tvOS、Linux 和 z/OS 開發的一種通用、多範式、編譯編程語言。Swift 設計用於與蘋果公司的 Cocoa 和 Cocoa Touch 框架以及為蘋果產品編寫的大量現有 Objective-C 代碼配合使用。
    cpp: C++ 是一種跨平臺語言，可用於創建高性能應用程序。C++ 是作為 C 語言的擴展而創建的。然而，由於 C++ 現已發展出更復雜的現代功能，C 語言已成為 C++ 的子集。C++ 有最好的編譯器，可以在大多數平臺上構建性能出色的應用程序。
    python: Python 是一種解釋型、面向對象、具有動態語義的高級編程語言。它的高級內置數據結構與動態類型和動態綁定相結合，使其在快速應用程序開發方面極具吸引力。
    git: Git 是一個快速、可擴展的分布式修訂控製系統，擁有異常豐富的命令集，既能進行高級操作，也能完全訪問內部結構。
    computer_vision: 計算機視覺是計算機科學的一個領域，主要研究如何讓計算機識別和理解圖像和視頻中的物體和人物。與其他類型的人工智能一樣，計算機視覺也致力於執行和自動化復製人類能力的任務。
