# experiences
  yolo-ffi:
    name: Self-Employed
    start: 18/10/2025
    end: 14/12/2025
    address: Taipei Taiwan
    title: Senior Flutter / Performance Engineer
    content: |
      Led the design and implementation of a high-performance edge AI inference system for real-time object detection on Android and iOS, using Flutter as the unified UI layer.
      Architected a C++-centric inference pipeline (preprocess → inference → postprocess) and integrated it with Flutter via Dart FFI, replacing MethodChannel to eliminate serialization overhead and cross-language data copying.
      Optimized memory management and data flow with zero/low-copy strategies, ensuring cache-friendly continuous memory access and minimizing allocation churn.
      Implemented UI–inference isolation using Dart Isolates and lock-free queues, maintaining smooth UI rendering under heavy AI workloads.
      Tuned CPU / GPU / Neural Engine execution paths (CoreML on iOS, NCNN/MNN on Android) to balance latency, throughput, and power efficiency.
      Achieved stable 60 FPS real-time detection on edge devices with zero UI frame drops, fully offline without server-side inference.
  ai-vocabulary:
    name: Self-Employed
    start: 18/10/2024
    end: 13/8/2025
    address: Taipei Taiwan
    title: Senior Software Engineer
    content: |
      Developed an AI-powered vocabulary learning application that integrates a self-maintained dictionary, utilizing a relational database for scalability and populated through web crawlers. Enhanced user experience with lazy loading lists, instant theme switching, TikTok-like gesture navigation. The fetching data has been engineered to prioritize local database queries over remote sources to optimize data retrieval and ensure the most efficient use of local resources, thereby reducing HTTP request count and loading latency. Applied OOP principles to achieve in-text word search, allowing users to tap a word and instantly retrieve its definitions and examples. Implemented AI-driven features such as speech-to-text for pronunciation practice and an interactive chatbot that helps users practice constructing English sentences. Designed a spaced repetition review system based on the Ebbinghaus forgetting curve and a custom calendar to visualize learning progress. Built scalable dictionary APIs with FastAPI and SQLAlchemy, and configured Nginx for multiple subdomains and paths routing. Containerized services with Docker and deployed them on Google Cloud Run to deliver a scalable and reliable web server.
